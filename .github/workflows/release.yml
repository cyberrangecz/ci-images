on:
  workflow_call:
    inputs:
      release_to_s3:
        type: boolean
        required: false
        default: true
    secrets:
      IMAGES_VAULT_ROLE_ID:
        required: true
      IMAGES_VAULT_SECRET_ID:
        required: true

env:
  OS_IDENTITY_API_VERSION: 3
  OS_INTERFACE: public
  OS_INSECURE: true

jobs:
  release:
    runs-on: gha-runner-scale-set-cyberrangecz
    container:
      image: ghcr.io/cyberrangecz/docker-image-builder
    steps:
      - uses: actions/checkout@v4

      - name: Import AWS Secrets from Vault
        id: import-secrets
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: https://192.168.54.53:8200
          method: approle
          roleId: ${{ secrets.IMAGES_VAULT_ROLE_ID }}
          secretId: ${{ secrets.IMAGES_VAULT_SECRET_ID }}
          tlsSkipVerify: true
          secrets: |
            secret/data/terraform/aws-credentials access_key | AWS_ACCESS_KEY_ID ;
            secret/data/terraform/aws-credentials secret_key | AWS_SECRET_ACCESS_KEY ;
            secret/data/images/images_sse sse_customer_key | AWS_SSE_CUSTOMER_KEY ;
            secret/data/images/application-credentials * ;
            secret/data/crczp-images-credentials * ;
            secret/data/images/aws-credentials * | IMAGES_ ;

      - name: Remove image from OpenTofu state
        run: |
          tofu init
          tofu workspace select ${{ github.event.repository.default_branch }}
          tofu state rm module.topology.openstack_images_image_v2.test_image || echo "::warning::Image not found in tfstate"

      - name: Get short SHA
        uses: benjlevesque/short-sha@v3.0

      - name: Set NAME env var
        run: cat terraform.tfvars | grep NAME | sed -E 's|.*=[ ]*"(.*)"|NAME=\1|' >> "$GITHUB_ENV"

      - name: Get previous image version
        run: |
          PREV_VERSION=$(openstack image show $NAME --column properties --format json --insecure | jq '.properties."owner_specified.openstack.version"' -re) || PREV_VERSION=0.1.0
          echo PREV_VERSION=$PREV_VERSION >> "$GITHUB_ENV"

      - name: Rename previous image
        run: openstack image set $NAME --name $NAME-$PREV_VERSION --insecure || echo "::warning::Previous image $NAME not found"

      - name: Rename latest image and set as public
        run: openstack image set $NAME-$SHA --name $NAME --public --property owner_specified.openstack.version=$GITHUB_REF_NAME --insecure

      - name: Download image locally
        if: ${{ inputs.release_to_s3 }}
        run: openstack image save --file "$NAME.qcow2" "$NAME" --insecure

      - name: Upload image to s3
        if: ${{ inputs.release_to_s3 }}
        run: |
          cat <<EOF> s3.conf
          [default]
          host_base = gm7ve.upcloudobjects.com
          host_bucket = %(bucket)s.gm7ve.upcloudobjects.com
          use_https = True
          EOF

          s3cmd -c s3.conf get s3://crczp-images/SHA256SUMS SHA256SUMS
          s3cmd -c s3.conf get s3://crczp-images/MD5SUMS MD5SUMS

          sed -i "/$NAME.qcow2/d" SHA256SUMS
          sha256sum $NAME.qcow2 >> SHA256SUMS
          sort -k 2 -o SHA256SUMS SHA256SUMS

          sed -i "/$NAME.qcow2/d" MD5SUMS
          md5sum $NAME.qcow2 >> MD5SUMS
          sort -k 2 -o MD5SUMS MD5SUMS

          s3cmd -c s3.conf get s3://crczp-images/index.html index.html
          sed -i "/$NAME.qcow2/d" index.html
          grep '<li>' index.html > list
          echo "<li><a href=\"$NAME.qcow2\">$NAME.qcow2</a></li>" >> list
          LC_ALL=C sort list > sorted_list
          sed -i '/<li>/,/<\/ul>/d' index.html
          sed -i -e '/<ul.*/{r sorted_list' -e 'a </ul>' -e '}' index.html

          s3cmd -c s3.conf put $NAME.qcow2 SHA256SUMS MD5SUMS index.html s3://crczp-images
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.import-secrets.outputs.IMAGES_access_key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.import-secrets.outputs.IMAGES_secret_key }}

      - name: Publish the release
        run: >
          curl -L -X PATCH
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          -H "X-GitHub-Api-Version: 2022-11-28"
          https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}
          -d '{"prerelease": false}'
