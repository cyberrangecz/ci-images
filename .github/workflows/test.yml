on:
  workflow_call:
    inputs:
      packer_only:
        type: string
        required: false
      packer_filename:
        type: string
        required: false
        default: "."
      tofu_import_image:
        type: boolean
        required: false
        default: false
      use_images_runner:
        type: boolean
        required: false
        default: true
    secrets:
      IMAGES_VAULT_ROLE_ID:
        required: true
      IMAGES_VAULT_SECRET_ID:
        required: true

env:
  TF_VAR_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}

  OS_IDENTITY_API_VERSION: 3
  OS_INTERFACE: public
  OS_INSECURE: true

jobs:
  build:
    runs-on: "${{ inputs.use_images_runner && 'images' || 'gha-runner-scale-set-cyberrangecz' }}"
    container:
      image: ghcr.io/cyberrangecz/docker-image-builder
      options: --privileged
      ports:
        - 5900:5900
    steps:
      - uses: actions/checkout@v4
      - name: checkout fix
        run: git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Import AWS Secrets from Vault
        id: import-secrets
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: https://192.168.54.53:8200
          method: approle
          roleId: ${{ secrets.IMAGES_VAULT_ROLE_ID }}
          secretId: ${{ secrets.IMAGES_VAULT_SECRET_ID }}
          tlsSkipVerify: true
          secrets: |
            secret/data/terraform/aws-credentials access_key | AWS_ACCESS_KEY_ID ;
            secret/data/terraform/aws-credentials secret_key | AWS_SECRET_ACCESS_KEY ;
            secret/data/images/images_sse sse_customer_key | AWS_SSE_CUSTOMER_KEY ;
            secret/data/images/application-credentials * ;
            secret/data/crczp-images-credentials * ;

      - name: Install packer qemu plugin
        run: packer plugins install github.com/hashicorp/qemu

      - name: Run packer init
        run: packer init ${{ inputs.packer_filename }} || true

      - name: Get short SHA
        uses: benjlevesque/short-sha@v3.0
        with:
          variable_name: TF_VAR_REV

      - name: Set NAME env var
        run: cat terraform.tfvars | grep NAME | sed -E 's|.*=[ ]*"(.*)"|NAME=\1|' >> "$GITHUB_ENV"

      - name: Build image
        run: packer build ${{ inputs.packer_only && format('-only={0}', inputs.packer_only) }} ${{ inputs.packer_filename }}

      - name: Initialize OpenTofu
        run: |
          tofu init
          tofu workspace select "$GITHUB_REF_NAME" || tofu workspace new "$GITHUB_REF_NAME"

      - name: OpenTofu Destroy
        run: tofu destroy -auto-approve -input=false

      - name: Upload image with OpenTofu
        if: ${{ !inputs.tofu_import_image }}
        run: tofu apply -auto-approve -input=false -target=module.topology.openstack_images_image_v2.test_image

      - name: Import image to OpenTofu
        if: ${{ inputs.tofu_import_image }}
        run: tofu import module.topology.openstack_images_image_v2.test_image $(openstack image show $NAME-$TF_VAR_REV --column id --format value --insecure)

      - name: Cleanup workdir
        if: always()
        run: git clean -ffdx && git reset --hard HEAD

  test:
    needs: [build]
    runs-on: gha-runner-scale-set-cyberrangecz
    container:
      image: ghcr.io/cybersecurityhubcz/opentofu-runner:1.10.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: checkout fix
        run: git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Get short SHA
        uses: benjlevesque/short-sha@v3.0
        with:
          variable_name: TF_VAR_REV

      - name: Import AWS Secrets from Vault
        id: import-secrets
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: https://192.168.54.53:8200
          method: approle
          roleId: ${{ secrets.IMAGES_VAULT_ROLE_ID }}
          secretId: ${{ secrets.IMAGES_VAULT_SECRET_ID }}
          tlsSkipVerify: true
          secrets: |
            secret/data/terraform/aws-credentials access_key | AWS_ACCESS_KEY_ID ;
            secret/data/terraform/aws-credentials secret_key | AWS_SECRET_ACCESS_KEY ;
            secret/data/images/images_sse sse_customer_key | AWS_SSE_CUSTOMER_KEY ;
            secret/data/images/application-credentials * ;
            secret/data/crczp-images-credentials * ;

      - name: OpenTofu Init
        run: |
          tofu init
          tofu workspace select "$GITHUB_REF_NAME"

      - name: OpenTofu Apply
        run: tofu apply -auto-approve -input=false
